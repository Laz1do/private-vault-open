<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f8f9f5">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>私人密码库</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="app-shell" id="app-shell" data-view="list">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 20 6v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/><path d="m8.5 11.5 2.5 2.5 4.5-5"/></svg></span>
        <div><h1>私人密码库</h1><p>随时找到你的密码</p></div>
      </div>
      <div class="header-sync">
        <div class="sync-summary"><span class="sync-state" id="sync-state" data-testid="sync-status" role="status"><i class="status-dot" aria-hidden="true"></i><span id="sync-label">正在打开</span></span><span class="sync-time" id="sync-time"></span></div>
        <button class="button secondary compact" id="sync-button" type="button" data-testid="sync-button" disabled aria-label="立即同步"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 7a7 7 0 0 1 11.7-1L20 9M4 15l2.2 3a7 7 0 0 0 11.7-1"/></svg><span>同步</span></button>
      </div>
    </header>
    <div class="mode-bar" aria-label="同步方式和文件操作">
      <div class="mode-switch" role="group" aria-label="同步方式">
        <button type="button" id="mode-file" data-testid="mode-file" class="mode-option is-active" aria-pressed="true">文件模式</button>
        <button type="button" id="mode-server" data-testid="mode-server" class="mode-option" aria-pressed="false">服务器模式</button>
      </div>
      <div class="file-tools">
        <button type="button" id="import-button" data-testid="import-button" class="button ghost compact" disabled>导入文件</button>
        <button type="button" id="export-button" data-testid="export-button" class="button ghost compact" disabled>导出文件</button>
        <button type="button" id="settings-button" data-testid="settings-button" class="button secondary compact" disabled>服务器设置</button>
      </div>
    </div>
    <p class="file-safety-note" id="file-safety-note">导出文件含密码、密钥和服务器设置，请自行保管，只传给自己的设备。</p>
    <main class="workspace" id="workspace">
      <section class="record-panel" aria-labelledby="records-heading" id="record-panel">
        <div class="panel-heading"><div><span class="eyebrow">我的密码</span><h2 id="records-heading">全部记录 <span class="record-count" id="record-count">0</span></h2></div><button class="button primary add-button" type="button" id="add-button" data-testid="add-button" disabled><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>新增</span></button></div>
        <div class="search-box"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><label class="sr-only" for="search-input">搜索密码记录</label><input type="search" id="search-input" data-testid="search-input" placeholder="搜索名称、账号或网址" autocomplete="off" autocapitalize="none" autocorrect="off" enterkeyhint="search"><kbd aria-hidden="true">Ctrl K</kbd></div>
        <div class="record-filters" aria-label="记录筛选"><button type="button" class="filter-button is-active" id="filter-all" data-testid="filter-all" aria-pressed="true">全部</button><button type="button" class="filter-button" id="filter-conflict" data-testid="filter-conflict" aria-pressed="false">待处理 <span id="conflict-count">0</span></button></div>
        <div class="record-list" id="record-list" data-testid="record-list" aria-label="密码记录"></div>
        <div class="sidebar-footnote"><span class="tiny-lock" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span>密码在你的设备上解密</div>
      </section>
      <section class="detail-panel" id="detail-panel" data-testid="detail-panel" aria-label="记录详情" tabindex="-1"></section>
    </main>
    <div class="connection-note" id="connection-note" hidden role="status"></div>
  </div>
  <div class="modal-layer" id="modal-layer" hidden><section class="modal-card" id="modal-card" role="dialog" aria-modal="true" tabindex="-1"></section></div>
  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true" hidden data-testid="toast"></div>
  <noscript><p>请开启 JavaScript 后使用密码库。</p></noscript>
</body>
</html>
